{% extends 'base.html' %}

{% block title %}Password Reset{% endblock %}

{% block extra_head %}
<style>

/* Page layout */
.reset-container{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:70vh;
}

/* Card */
.reset-card{
    width:100%;
    max-width:420px;
    padding:35px;
    border-radius:10px;
    background:#ffffff;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
    font-family:Arial, Helvetica, sans-serif;
}

/* Title */
.reset-title{
    text-align:center;
    margin-bottom:20px;
}

/* Inputs */
.reset-card input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:18px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:14px;
}

/* Labels */
.reset-card label{
    font-weight:600;
}

/* Button */
.reset-btn{
    width:100%;
    padding:10px;
    border:none;
    border-radius:6px;
    background:#0d6efd;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.reset-btn:hover{
    background:#0b5ed7;
}

/* Info text */
.reset-info{
    text-align:center;
    font-size:14px;
    color:#555;
    margin-bottom:20px;
}

</style>
{% endblock %}

{% block content %}

<div class="reset-container">

    <div class="reset-card">

        <h2 class="reset-title">Password Reset</h2>

        <p class="reset-info">
            Enter your email address and we'll send you a link to reset your password.
        </p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="reset-btn">
                Send Reset Email
            </button>
        </form>

    </div>

</div>

{% endblock %}
