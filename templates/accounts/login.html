{% extends 'base.html' %}


{% block title %}Login{% endblock %}

{% block extra_head %}

<style>
/* Page layout */
.login-container{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:70vh;
}

/* Card */
.login-card{
    width:100%;
    max-width:420px;
    padding:35px;
    border-radius:10px;
    background:white;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
    font-family:Arial, Helvetica, sans-serif;
}

/* Title */
.login-title{
    text-align:center;
    margin-bottom:25px;
}

/* Form fields */
.login-card input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:18px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:14px;
}

/* Labels */
.login-card label{
    font-weight:600;
}

/* Button */
.login-btn{
    width:100%;
    padding:10px;
    border:none;
    border-radius:6px;
    background:#0d6efd;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.login-btn:hover{
    background:#0b5ed7;
}

/* Links */
.login-links{
    margin-top:15px;
    text-align:center;
    font-size:14px;
}

.login-links a{
    color:#0d6efd;
    text-decoration:none;
}

.login-links a:hover{
    text-decoration:underline;
}
</style>
{% endblock %}

{% block content %}

<div class="login-container">

    <div class="login-card">

        <h2 class="login-title">Login</h2>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="login-links">
            <p>
                <a href="{% url 'accounts:password_reset' %}">
                    Forgot password?
                </a>
            </p>

            <p>
                Don't have an account?
                <a href="{% url 'accounts:register' %}">
                    Register here
                </a>
            </p>
        </div>

    </div>

</div>

{% endblock %}
