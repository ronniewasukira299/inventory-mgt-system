name: Django CI

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        pip install django django-cors-headers django-ratelimit

    - name: Run Tests
      env:
        SECRET_KEY: ci-test-secret-key-not-for-production
        DEBUG: "True"
        DJANGO_SETTINGS_MODULE: inventory_mgt.settings
      run: python manage.py test
