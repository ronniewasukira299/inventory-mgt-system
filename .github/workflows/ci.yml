name: Django CI

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        pip install django django-cors-headers django-ratelimit gunicorn flake8

    - name: Run Linting
      run: |
        flake8 . --exclude=migrations,venv,__pycache__ --max-line-length=120

    - name: Run Tests
      env:
        DJANGO_SETTINGS_MODULE: inventory_mgt.settings
      run: python manage.py test